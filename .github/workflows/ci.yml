name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PRs only, so every commit on main gets a finished run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id is the required status check in the "Protect main" ruleset. Don't rename it.
  build-and-test:
    # macos-26 ships Xcode 26 (Swift 6.2), which KeyboardShortcuts 3.x needs (ADR-0005).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # Pinned to a commit SHA; Dependabot keeps it current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: brew install xcodegen swiftlint swiftformat

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Lint
        run: make lint

      - name: Core tests
        run: make test-core

      - name: Generate project
        run: make bootstrap

      - name: Build and test app
        run: make test-app
